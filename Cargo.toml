[package]
name = "vinit"
version = "0.4.0"
edition = "2021"

description = "Zero-cost, type-safe Vulkan initialization with compile-time guarantees"
license-file = "LICENSE"

repository = "https://github.com/Fasamii/vinit"
homepage = "https://github.com/Fasamii/vinit"

readme = "README.md"
keywords = ["vulkan", "graphics", "init", "initialization", "ash"]
categories = ["graphics"]

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
log = "0.4.29"
static_assertions = "1.1.0"
winit = "0.30.12"
[dev-dependencies]
env_logger = "0.11.8"
